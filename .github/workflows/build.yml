name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, fileinfo, curl
          tools: composer
      - run: npm ci
      - run: composer install --no-dev --optimize-autoloader
        working-directory: api
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: karriereseite-dist
          path: dist

      # Deployment: Render baut bei jedem Push auf main automatisch aus dem Dockerfile (siehe render.yaml).
      - name: Docker-Image testweise bauen
        run: docker build -t karriere-test .
